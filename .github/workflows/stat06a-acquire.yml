name: STAT-06A acquire official ACS income into candidate branch
on:
  push:
    branches: [feat/stat06a-acs-income-publication]
    paths:
      - .github/workflows/stat06a-acquire.yml
permissions:
  contents: write
jobs:
  official-acquisition:
    if: github.repository == 'American-Republic-Futures-Institute/afri-data'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Inspect official public ACS summary file listings (no API key)
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          root='https://www2.census.gov/programs-surveys/acs/summary_file/2024/'
          paths=['','sequence-based-SF/','sequence-based-SF/data/','sequence-based-SF/data/5_year_by_state/','sequence-based-SF/data/5_year_entire_sf/']
          for path in paths:
              try:
                  with urlopen(Request(root+path,headers={'User-Agent':'ARFI-Research/1.0'}),timeout=20) as page:
                      raw=page.read(9000).decode('utf8','replace')
                      print('OFFICIAL_STATIC_PATH',path or '/',page.status,len(raw))
                      print('LISTING_SNIPPET',raw[0:1800].replace('\\n',' '))
              except Exception as exc:
                  print('OFFICIAL_STATIC_UNAVAILABLE',path,type(exc).__name__,str(getattr(exc,'code','')))
          PY
      - name: Check anonymous official ACS data access (no credentials)
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          PUBLIC_URL='https://api.census.gov/data/2024/acs/acs5?get=NAME%2CB19013_001E%2CB19013_001M&for=state%3A%2A'
          try:
              with urlopen(Request(PUBLIC_URL,headers={'Accept':'application/json','User-Agent':'ARFI-Research/1.0'}),timeout=25) as f:
                  payload=f.read(500000)
                  print('ACS_ANONYMOUS_ACCESS',f.status,'length',len(payload))
                  print('ACS_ANONYMOUS_SCHEMA',payload[:140].decode('utf8','replace'))
          except Exception as e:
              print('ACS_ANONYMOUS_UNAVAILABLE',type(e).__name__,getattr(e,'code',''))
          PY
      - name: Check Census acquisition availability without exposing credentials
        id: source
        shell: bash
        run: |
          if [ -n "$CENSUS_API_KEY" ]; then
            echo 'configured=yes' >> "$GITHUB_OUTPUT"
            echo '::notice::Census source acquisition credential is configured.'
          else
            echo 'configured=no' >> "$GITHUB_OUTPUT"
            echo '::warning::CENSUS_API_KEY not configured; no source values will be generated or published.'
          fi
      - name: Install frozen validation dependencies
        if: steps.source.outputs.configured == 'yes'
        run: python -m pip install -r requirements.txt
      - name: Acquire original Census bytes and stage source-reproduced release
        if: steps.source.outputs.configured == 'yes'
        run: python -m pipelines.census_acs_release
      - name: Validate source publication and offline regression suite
        if: steps.source.outputs.configured == 'yes'
        run: |
          python -m tools.validate
          python -m unittest discover -s tests -v
      - name: Commit original-source release to same review branch
        if: steps.source.outputs.configured == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publication/
          if git diff --cached --quiet; then
            echo 'No source changes; existing publication already matches.'
            exit 0
          fi
          git commit -m "data(stat06a): stage original verified Census ACS 2024 income release"
          git push origin HEAD:refs/heads/feat/stat06a-acs-income-publication
