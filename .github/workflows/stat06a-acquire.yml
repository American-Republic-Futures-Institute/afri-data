name: STAT-06A inspect official 2024 ACS table-based source
on:
  push:
    branches: [feat/stat06a-acs-income-publication]
    paths:
      - .github/workflows/stat06a-acquire.yml
permissions:
  contents: read
jobs:
  official-source-inspection:
    if: github.repository == 'American-Republic-Futures-Institute/afri-data'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect published B19013 table-based raw CSV rows
        shell: bash
        run: |
          python - <<'PY'
          import io,csv,hashlib
          from urllib.request import Request,urlopen
          url='https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/data/5YRData/acsdt5y2024-b19013.dat'
          request=Request(url,headers={'User-Agent':'ARFI-Public-Data-Observatory/1.0','Accept':'text/plain,*/*','Accept-Encoding':'identity'})
          with urlopen(request,timeout=55) as f:
              print('SOURCE_HTTP',f.status,'content-type',f.headers.get('Content-Type'))
              raw=f.read(22000000)
              print('SOURCE_URL',f.geturl(),'SOURCE_BYTES',len(raw),'SHA256',hashlib.sha256(raw).hexdigest())
          reader=csv.reader(io.StringIO(raw.decode('utf-8-sig')))
          for i,row in enumerate(reader):
              if i<5:print('SOURCE_HEADER_ROW',i,repr(row[:12])[:600])
              if i>100:break
          print('SOURCE_FIRST_700',repr(raw[:700]))
          PY
