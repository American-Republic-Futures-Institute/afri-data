name: Diagnose USAspending geographic code schema (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/inspect_usaspending.py
      - .github/workflows/inspect-usaspending-schema.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'American-Republic-Futures-Institute/afri-data'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect exact public Treasury geographic code contract
        run: python -m tools.inspect_usaspending
