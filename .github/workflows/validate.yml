name: Validate ARFI data contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  validation:
    name: Evidence catalog and integrity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Qualify federal Data.gov source discovery, authorization and cursor invariants
        run: python -m unittest discover -s tests -p 'test_datagov_discovery.py' -v
      - name: Test EPA AirData original ZIP custody, geography and source-family contracts
        run: python -m unittest discover -s tests -p "test_epa_airdata_source_library.py" -v
      - name: Test NOAA NCEI original fixed-width climate histories, safe discovery and SHA replay
        run: python -m unittest discover -s tests -p 'test_noaa_ncei_source_library.py' -v
      - name: Validate publisher, dataset and indicator catalogs
        run: python tools/validate.py --catalog-only
      - name: Run offline conversion, geography and security regressions
        run: python -m unittest discover -s tests -v
      - name: Validate pinned statistical source profiles and eligibility registry
        run: python -m arfi_stats.eligibility --verify-profiles
      - name: Deterministic synthetic statistical artifact generation and replay
        shell: bash
        run: |
          set -euo pipefail
          for kind in histogram ecdf boxplot; do
            artifact="$RUNNER_TEMP/stat02a-$kind.json"
            python -m arfi_stats.artifacts produce \
              --input examples/statkit-synthetic.json \
              --request "examples/stat02a-$kind-request.json" \
              --output "$artifact"
            python -m arfi_stats.artifacts replay \
              --input examples/statkit-synthetic.json \
              --artifact "$artifact" > /dev/null
          done
      - name: Verify source-bound Census internal distribution pilot and replay
        shell: bash
        run: |
          set -euo pipefail
          for kind in histogram ecdf boxplot; do
            artifact="$RUNNER_TEMP/stat02a2-census-$kind.json"
            python -m arfi_stats.census_pilot produce --kind "$kind" --output "$artifact"
            python -m arfi_stats.census_pilot replay --artifact "$artifact" > /dev/null
          done
      - name: Verify all STAT-05 geographic cohorts against immutable publisher sources
        run: python -m tools.stat05_cohorts verify
      - name: Recompute and validate all nine published descriptive distributions
        run: python -m tools.stat04_descriptive verify
      - name: Reproduce published Census descriptive histogram (no independent review claimed)
        run: python -m tools.verify_census_descriptive
      - name: Verify STAT-02B rejects unpublished analytical candidates
        shell: bash
        run: |
          set -euo pipefail
          for kind in histogram ecdf boxplot; do
            candidate="$RUNNER_TEMP/stat02b-$kind.json"
            decision="$RUNNER_TEMP/stat02b-$kind-decision.json"
            python -m arfi_stats.publication_gate candidate --kind "$kind" > "$candidate"
            if python -m arfi_stats.publication_gate verify --input "$candidate" > "$decision"; then
              echo "STAT-02B must refuse publication without real independent method review" >&2
              exit 1
            else
              python -c 'import json,sys; v=json.load(open(sys.argv[1])); assert v["decision"]=="denied" and not v["publicationAuthorized"] and v["sourceReplayVerified"]' "$decision"
            fi
          done
      - name: Enforce immutable statistical review and publication transitions
        if: github.event_name == 'pull_request'
        run: python -m tools.stat_transition --base origin/main
      - name: Refuse removal of founder or independent statistical history on main pushes
        if: github.event_name == 'push'
        env:
          ARFI_PUSH_BEFORE: ${{ github.event.before }}
        run: python -m tools.stat_transition --base "$ARFI_PUSH_BEFORE"
      - name: Inspect canonical Census histogram candidate (no approval issued)
        run: |
          python -m tools.stat_founder_packet inspect
          python -m tools.stat_founder_packet chart-fixture
      - name: Verify authenticated statistical publication registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARFI_GOVERNANCE_READ_TOKEN: ${{ secrets.ARFI_GOVERNANCE_READ_TOKEN }}
        run: python -m tools.stat_approval verify
      - name: Verify explicit founder-review provenance and publication registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARFI_GOVERNANCE_READ_TOKEN: ${{ secrets.ARFI_GOVERNANCE_READ_TOKEN }}
        run: |
          python -m tools.stat_founder verify
          python -m tools.stat_founder registry
      - name: Verify candidate BLS dossier source fingerprints
        run: python -m tools.review_pilot_dossier --verify
      - name: Report human review activation blockers
        run: python -m tools.review_activation --offline
      - name: Refuse removal or modification of approved evidence across pull requests
        if: github.event_name == 'pull_request'
        run: python -m tools.release_transition --base origin/main
      - name: Validate reviewer policy and time-bounded qualifications
        run: python -m tools.reviewer_policy
      - name: Verify historical and independent evidence-review provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARFI_GOVERNANCE_READ_TOKEN: ${{ secrets.ARFI_GOVERNANCE_READ_TOKEN }}
        run: python -m tools.review_governance --online
      - name: Verify published evidence if present
        shell: bash
        run: |
          if test -f publication/index.json; then
            GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" ARFI_GOVERNANCE_READ_TOKEN="${{ secrets.ARFI_GOVERNANCE_READ_TOKEN }}" python tools/validate.py --verify-review-online
          else
            echo "No approved release on this branch; initial catalog only."
          fi
