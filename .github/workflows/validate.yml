name: Validate ARFI data contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  validation:
    name: Evidence catalog and integrity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate publisher, dataset and indicator catalogs
        run: python tools/validate.py --catalog-only
      - name: Run offline conversion, geography and security regressions
        run: python -m unittest discover -s tests -v
      - name: Refuse removal or modification of approved evidence across pull requests
        if: github.event_name == 'pull_request'
        run: python -m tools.release_transition --base origin/main
      - name: Verify historical and independent evidence-review provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tools.review_governance --online
      - name: Verify published evidence if present
        shell: bash
        run: |
          if test -f publication/index.json; then
            python tools/validate.py
          else
            echo "No approved release on this branch; initial catalog only."
          fi
