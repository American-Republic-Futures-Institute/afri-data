name: DATA-19 EIA SEDS publisher CSV format probe
on:
  pull_request:
    paths:
      - '.github/workflows/probe-eia-seds.yml'
      - 'tools/eia_seds_source_library.py'
      - 'catalog/source-library/eia-seds.json'
      - 'tests/test_eia_seds_source_library.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run EIA original-data and custody regressions
        run: python -m unittest discover -s tests -p 'test_eia_seds_source_library.py' -v
      - name: Acquire five EIA original state consumption series and save fingerprints
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.eia_seds_source_library import registry_sources,eia_records,STATES
          report=[]
          for spec in registry_sources():
              rows=eia_records(spec)
              years=sorted({r["record_date"][:4] for r in rows})
              if len(years)<60 or len(rows)!=len(years)*len(STATES):
                  raise ValueError("Publisher SEDS annual state history incomplete")
              digests={r["source_original_sha256"] for r in rows}
              if len(digests)!=1:
                  raise ValueError("Publisher CSV altered within one acquisition")
              obj={"id":spec["id"],"msn":spec["msn"],
                   "source":spec["endpoint"],"years":[years[0],years[-1]],
                   "states":len(STATES),"records":len(rows),
                   "originalCsvSha256":next(iter(digests))}
              report.append(obj)
              print(json.dumps(obj,sort_keys=True))
          Path("eia-seds-live-probe.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          PY
      - name: Retain actual publisher-original EIA acquisition proof
        uses: actions/upload-artifact@v4
        with:
          name: data19-eia-original-csv
          path: eia-seds-live-probe.json
          retention-days: 30
      - name: Obtain authoritative no-key Btu source and verify original header and MSN codes
        run: |
          python - <<'PY'
          import urllib.request,csv,io,hashlib,json
          url="https://www.eia.gov/state/seds/sep_use/total/csv/use_all_btu.csv"
          req=urllib.request.Request(url,headers={
              "User-Agent":"ARFI-Original-Source-Mirror/1.0 (https://arfinstitute.org)",
              "Accept":"*/*"})
          with urllib.request.urlopen(req,timeout=75) as response:
              assert response.geturl()==url
              blob=response.read(35_000_001)
              assert 100000<len(blob)<=35000000
              print("EIA publisher bytes",len(blob),"SHA256",hashlib.sha256(blob).hexdigest(),
                    "Content-Type",response.headers.get("content-type"))
          parsed=csv.reader(io.StringIO(blob.decode("utf-8-sig"),newline=""))
          hdr=next(parsed)
          print("Publisher header",json.dumps(hdr))
          check={"TETCB","TERCB","TECCB","TEICB","TEACB","TETPB"}
          samples={};cnt=0;msns=set();geos=set()
          for row in parsed:
              cnt+=1
              if cnt<=2:print("First source row",json.dumps(row[:12]))
              if len(row)>=3:
                  msn=next((x for x in row[:4] if x.strip() in check),None)
                  if msn:
                      msns.add(msn)
                      if msn not in samples:samples[msn]=row[:8]
                  geos.add(row[1].strip())
          # Measure selected publisher-code geography completeness and missing markers.
          selected={code:{} for code in check}
          missing={code:{} for code in check}
          state_codes=set("AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY".split())
          for row in csv.DictReader(io.StringIO(blob.decode("utf-8-sig"),newline="")):
              code=row["MSN"].strip()
              if code not in selected or row["State"] not in state_codes:
                  continue
              assert row["State"] not in selected[code],"Duplicate EIA state/MSN row"
              selected[code][row["State"]]=row
              for year in list(row):
                  if year.isdigit() and not row[year].replace(".","",1).replace("-","",1).isdigit():
                      marker=row[year]
                      missing[code][marker]=missing[code].get(marker,0)+1
          print(json.dumps({"selectedCodeStateCounts":{k:len(v) for k,v in selected.items()},
                 "nonNumericPublisherValues":missing},sort_keys=True))
          assert all(len(selected[code])==51 for code in ("TETCB","TERCB","TECCB","TEICB","TEACB")),"Incomplete state coverage"
          print(json.dumps({"rows":cnt,"foundMSN":sorted(msns),
                "samples":samples,"sampleGeographies":sorted(geos)[:25],
                "firstStateCodes":sorted(geos)[0:25]},sort_keys=True))
          assert {"TETCB","TERCB","TECCB","TEICB","TEACB"}.issubset(msns),"Expected sector MSI absent"
          PY
