name: DATA-19 EIA SEDS publisher CSV format probe
on:
  pull_request:
    paths:
      - '.github/workflows/probe-eia-seds.yml'
      - 'tools/eia_seds_source_library.py'
      - 'catalog/source-library/eia-seds.json'
      - 'tests/test_eia_seds_source_library.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain authoritative no-key Btu source and verify original header and MSN codes
        run: |
          python - <<'PY'
          import urllib.request,csv,io,hashlib,json
          url="https://www.eia.gov/state/seds/sep_use/total/csv/use_all_btu.csv"
          req=urllib.request.Request(url,headers={
              "User-Agent":"ARFI-Original-Source-Mirror/1.0 (https://arfinstitute.org)",
              "Accept":"*/*"})
          with urllib.request.urlopen(req,timeout=75) as response:
              assert response.geturl()==url
              blob=response.read(35_000_001)
              assert 100000<len(blob)<=35000000
              print("EIA publisher bytes",len(blob),"SHA256",hashlib.sha256(blob).hexdigest(),
                    "Content-Type",response.headers.get("content-type"))
          parsed=csv.reader(io.StringIO(blob.decode("utf-8-sig"),newline=""))
          hdr=next(parsed)
          print("Publisher header",json.dumps(hdr))
          check={"TETCB","TERCB","TECCB","TEICB","TEACB","TETPB"}
          samples={};cnt=0;msns=set();geos=set()
          for row in parsed:
              cnt+=1
              if cnt<=2:print("First source row",json.dumps(row[:12]))
              if len(row)>=3:
                  msn=next((x for x in row[:4] if x.strip() in check),None)
                  if msn:
                      msns.add(msn)
                      if msn not in samples:samples[msn]=row[:8]
                  geos.add(row[1].strip())
          print(json.dumps({"rows":cnt,"foundMSN":sorted(msns),
                "samples":samples,"sampleGeographies":sorted(geos)[:25],
                "firstStateCodes":sorted(geos)[0:25]},sort_keys=True))
          assert {"TETCB","TERCB","TECCB","TEICB","TEACB"}.issubset(msns),"Expected sector MSI absent"
          PY
