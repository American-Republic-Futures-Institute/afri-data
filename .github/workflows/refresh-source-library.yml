name: Weekly authoritative source library refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '13 11 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-source-library.yml'
      - 'catalog/source-library/**'
      - 'tools/source_library.py'
      - 'tools/source_catalog_pages.py'
      - 'tools/eia_seds_source_library.py'
      - 'tools/noaa_ncei_source_library.py'
      - 'tests/test_noaa_ncei_source_library.py'
      - 'tools/source_freshness.py'
      - 'tests/test_source_freshness.py'
      - 'tests/test_source_catalog_pages.py'
      - 'tests/test_eia_seds_source_library.py'
      - 'tools/cdc_places_source_library.py'
      - 'tools/bls_qcew_source_library.py'
      - 'tools/epa_airdata_source_library.py'
      - 'tools/bea_regional_source_library.py'
      - 'tools/usgs_comcat_source_library.py'
      - 'tests/test_usgs_comcat_source_library.py'
      - 'tests/test_epa_airdata_source_library.py'
      - 'tests/test_bea_regional_source_library.py'
      - 'tools/census_acs_source_library.py'
      - 'tests/test_census_acs_source_library.py'
      - 'tests/test_bls_qcew_source_library.py'
      - 'tests/test_cdc_source_library.py'
      - 'tests/test_source_library.py'
permissions:
  contents: write
concurrency:
  group: weekly-official-source-library
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'American-Republic-Futures-Institute/afri-data'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source pipeline before acquisition
        run: |
          python -m unittest discover -s tests -p 'test_source_library.py' -v
          python -m unittest discover -s tests -p 'test_cdc_source_library.py' -v
          python -m unittest discover -s tests -p 'test_bls_qcew_source_library.py' -v
          python -m unittest discover -s tests -p 'test_census_acs_source_library.py' -v
      - name: Verify EPA AirData original ZIP ingestion and absence of reconstructed data
        run: python -m unittest discover -s tests -p "test_epa_airdata_source_library.py" -v
      - name: Verify BEA regional ZIP records and SHA-256 revision semantics
        run: python -m unittest discover -s tests -p "test_bea_regional_source_library.py" -v
      - name: Verify USGS ComCat annual source CSV, published count and exact-byte retention
        run: python -m unittest discover -s tests -p "test_usgs_comcat_source_library.py" -v
      - name: Verify bounded source catalog shards before weekly acquisition
        run: python -m unittest discover -s tests -p 'test_source_catalog_pages.py' -v
      - name: Verify EIA SEDS original publisher CSV historical and revision custody
        run: python -m unittest discover -s tests -p 'test_eia_seds_source_library.py' -v
      - name: Verify NOAA divisional originals, publisher README and full-history replay
        run: python -m unittest discover -s tests -p 'test_noaa_ncei_source_library.py' -v
      - name: Restore persistent source-library branch and reconcile source code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git ls-remote --exit-code --heads origin data/source-library >/dev/null 2>&1; then
            git fetch origin refs/heads/data/source-library
            git switch -C data/source-library FETCH_HEAD
            git merge --no-edit origin/main
          else
            git switch -c data/source-library
          fi
      - name: Fetch authoritative Treasury, CDC, BLS, Census, EPA, BEA, USGS, EIA and NOAA original histories and update partitions
        run: python -m tools.source_library
      - name: Independently verify every retained source partition
        run: python -m tools.source_library --verify
      - name: Check exact registered/acquired/revised source coverage and release-lag honesty
        run: python -m tools.source_freshness --verify
      - name: Publish validated source copies to the rolling data branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- publication/source-library/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Treasury, CDC, BLS, Census, EPA, BEA and USGS, EIA and NOAA official source-library partitions"
          fi
          git push origin HEAD:refs/heads/data/source-library
      - name: Surface publisher failures instead of silently claiming full freshness
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path("publication/source-library/health.json").read_text())
          print("Source refresh:",status["succeeded"],"of",status["attempted"],"succeeded")
          print("Last checked:",status["checkedAt"])
          freshness=json.loads(Path("publication/source-library/acquisition-ledger.json").read_text())
          print("Canonical mirrored datasets:", freshness["totals"]["mirrored"])
          print("Registered source feeds:", freshness["totals"]["registered"])
          print("Previously mirrored but retained after upstream failure:", freshness["totals"]["retainedAfterFailure"])
          print("Newly mirrored this run:", freshness["totals"]["newlyMirroredAtThisRefresh"])
          print("Revised previously mirrored sources:", freshness["totals"]["changedMirroredAtThisRefresh"])
          print("Publisher publication-to-Git latency:", freshness["publicationLagMeasurementStatus"])
          for key,value in status["failed"].items():
              print(f"::warning title=Government source temporarily unavailable::{key}: {value}")
          for key,value in status.get("discoveryWarnings", {}).items():
              print(f"::warning title=New federal publisher release discovery temporarily unavailable::{key}: {value}")
          if status["failed"]:
              raise SystemExit("Partial source refresh. Successful feeds were published, failed feeds retained their last valid versions.")
          PY
